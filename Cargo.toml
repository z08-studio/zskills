[package]
name = "zskills"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A self-hosted workbench for reading and exploring Agent Skills"

[lib]
path = "backend/lib.rs"

[[bin]]
name = "zskills"
path = "backend/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
hostname = "0.4"
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
